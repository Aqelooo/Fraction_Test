<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction | Instant Cashback Jordan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        .float-anim { animation: float 4s ease-in-out infinite; }
        .bg-mesh { background: radial-gradient(at 0% 0%, rgba(255,0,0,0.15) 0, transparent 50%), radial-gradient(at 100% 100%, rgba(43,68,255,0.15) 0, transparent 50%); }
    </style>
</head>
<body class="bg-black text-white font-sans bg-mesh min-h-screen">
    <nav class="flex justify-between items-center p-6 max-w-7xl mx-auto">
        <img src="logo.png" alt="Fraction Logo" class="h-12">
        <div class="hidden md:flex gap-8 font-bold text-sm">
            <a href="index.html" class="text-blue-500">Home</a>
            <a href="stores.html" class="hover:text-red-500 transition">The Network</a>
            <a href="insights.html" class="hover:text-red-500 transition">Merchant Insights</a>
            <a href="contact.html" class="hover:text-red-500 transition">Contact</a>
        </div>
        <button class="bg-red-600 px-6 py-2 rounded-full font-black skew-x-[-10deg] hover:scale-110 transition">JOIN NOW</button>
    </nav>

    <header class="max-w-7xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center justify-between">
        <div class="md:w-1/2 mb-12 md:mb-0">
            <h1 class="text-7xl md:text-9xl font-black italic uppercase leading-none mb-6">
                GET <span class="text-blue-600">PAID</span> <br> TO <span class="text-red-600">SHOP.</span>
            </h1>
            <p class="text-xl text-gray-400 mb-8 border-l-4 border-blue-600 pl-4">
                No Banks. No Interest. Just Cash. <br>The first Halal-friendly rewards app in Jordan.
            </p>
            <div class="flex gap-4">
                <button class="bg-white text-black px-8 py-4 rounded-xl font-black flex items-center gap-2 hover:bg-blue-600 hover:text-white transition">
                    <i data-lucide="download"></i> GET THE APP
                </button>
            </div>
        </div>
        <div class="md:w-1/2 relative">
            <div class="w-72 h-72 bg-blue-600 rounded-full absolute top-10 right-10 blur-[100px] opacity-30"></div>
            <div class="bg-zinc-900 border-4 border-zinc-800 p-8 rounded-[3rem] float-anim relative z-10 mx-auto w-64 shadow-2xl">
                <div class="text-center">
                    <i data-lucide="qr-code" size="120" class="mx-auto mb-6 text-red-600"></i>
                    <p class="font-black text-xl">SCAN ME</p>
                    <p class="text-gray-500 text-xs mt-2">Earn 2.5 JOD Instant Cashback</p>
                </div>
            </div>
        </div>
    </header>

    <script>lucide.createIcons();</script>
</body>
</html>
