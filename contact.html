<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Contact Fraction</title>
</head>
<body class="bg-black text-white">
    <nav class="p-6"><a href="index.html"><img src="logo.png" class="h-10"></a></nav>

    <section class="max-w-7xl mx-auto px-6 py-12 grid md:grid-cols-2 gap-12">
        <div>
            <h1 class="text-6xl font-black mb-6 italic uppercase">LET'S <span class="text-red-600">TALK.</span></h1>
            <p class="text-gray-400 mb-12">Want to join the network? Need support? We are here to help Jordan shop smarter.</p>
            
            <form class="space-y-4">
                <input type="text" placeholder="Full Name" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 focus:border-blue-600">
                <input type="email" placeholder="Email Address" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 focus:border-blue-600">
                <textarea placeholder="Your Message" rows="5" class="w-full bg-zinc-900 p-4 rounded-xl outline-none border border-zinc-800 focus:border-blue-600"></textarea>
                <button class="w-full bg-blue-600 p-4 rounded-xl font-black hover:bg-red-600 transition">SEND MESSAGE</button>
            </form>
        </div>

        <div>
            <div class="h-[400px] bg-zinc-900 rounded-[3rem] overflow-hidden border-4 border-zinc-800">
                <!-- Replace src with your specific Jordan location if needed -->
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d108391.19472622432!2d35.856985062500004!3d31.9539494!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x151ca25292795f79%3A0xf60312fa3731f82e!2sAmman!5e0!3m2!1sen!2sjo!4v1700000000000!5m2!1sen!2sjo" 
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
            <div class="mt-8 flex gap-6">
                <div class="flex items-center gap-2"><i data-lucide="phone" class="text-red-600"></i> +962 7X XXX XXXX</div>
                <div class="flex items-center gap-2"><i data-lucide="mail" class="text-blue-600"></i> hello@fraction.jo</div>
            </div>
        </div>
    </section>
    <script>lucide.createIcons();</script>
</body>
</html>
